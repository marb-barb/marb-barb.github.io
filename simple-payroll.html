<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="mar's simple payroll" content="about mar's simple payroll">
            <meta name="author" content="marb.barb">
            <meta name="viewport" content="width=device-width, intial-scale=1.0">
            <title>mar's simple payroll</title>
            <link rel="stylesheet" href="style.css">
        </head>
        <body>
            <header>
                <h1>mar's not so simple payroll</h1>
            </header>
                <div class="employeeInformation">
                    <h2>Employee Information:</h2><br>
                    <div class="employeeInputs">
                    <label for="employeeName">Employee Name: </label><br>
                    <input type="text" id="employeeName"><br>
                    <label for="daysWorked">Days Worked: </label><br>
                    <input type="number" id="daysWorked"><br>
                    <label for="dailyRate">Daily Rate: </label><br>
                    <input type="number" id="dailyRate"><br>
                    <label for="deductionAmount">Deduction Amount: </label><br>
                    <input type="number" id="deductionAmount"><br><br>
                </div><a href="./index.html"><h3 id="back">back</h3></a></div>        
                
                <br>

                <div class="payrollConfig">
                <button id="rowAdd">add</button>
                <button id="rowDelete">delete</button>
                <br><br>
                <button id="rowDeleteAll"><strong>delete all</strong></button>
                </div>
                <table id="payrollTable">
                <thead>
                    <tr>
                        <th>no.</th>
                        <th>employee name</th>
                        <th>days worked</th>
                        <th>daily rate</th>
                        <th>gross pay</th>
                        <th>deduction</th>
                        <th>net pay</th>
                    </tr>
                </thead>
                <tbody id="payrollDisplay"></tbody>
            </table>
            <script src="simple-payroll.js"></script>
        </body>
    </html>
