<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="mar's unit converter" content="about mar's unit converter">
            <meta name="author" content="marb.barb">
            <meta name="viewport" content="width=device-width, intial-scale=1.0">
            <title>mar's unit converter</title>
            <link rel="stylesheet" href="style.css">
        </head>
        <body>
            <header>
                <h1>unit converter</h1>
            </header>
            <main>
                <div class="unit-converter">
                    <label for="conversion-type"><strong>unit type</strong></label>
                    <select name="conversion-type" id="convert" place>
                        <option value="1">Fahrenheit to Celsius</option>
                        <option value="2">Celsius to Farenheit</option>
                        <option value="3">Meters to Feet</option>
                        <option value="4">Feet to Meters</option>
                    </select>
                    <br>
                    <label for="inputUnit"><strong>Input:</strong></label><br>
                    <input id="inputUnit" type="number"><br>
                    <label for="outputUnit"><strong>Output:</strong></label><br>
                    <p id="output"></p><br>
                    <a href="./index.html"><h3 id="back">back</h3></a>

                    <script src="converter.js"></script>
                </div>
            </main>
        </body>
    </html>
